name: Advanced Typescript Testing with Dependencies

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  # Job 1: Setup y validación inicial
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Generate cache key
        id: cache-key
        run: echo "key=node-modules-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

  # Job 2: Linting (depende de setup)
  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript
        run: npm run lint

  # Job 3: Unit Tests (depende de setup)
  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit Test TypeScript
        run: npm run test:unit

  # Job 4: Coverage (depende de test exitoso)
  coverage:
    runs-on: ubuntu-latest
    needs: [setup, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  # Job 5: Build (depende de lint y test exitosos)
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-files
          path: dist/

  # Job 6: Security Check (independiente, continúa aunque falle)
  security:
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: true  # Continúa aunque este job falle
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Continúa aunque este step falle

      - name: Security report
        if: always()  # Siempre ejecuta este step
        run: echo "Security check completed (may have found vulnerabilities)"
