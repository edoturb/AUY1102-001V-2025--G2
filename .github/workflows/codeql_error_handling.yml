name: "CodeQL Error Handling Demo"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      force_failure:
        description: 'Force a job to fail for testing'
        required: false
        default: false
        type: boolean

jobs:
  # Job que puede fallar pero no detiene el workflow
  preliminary-checks:
    name: Preliminary Security Checks
    runs-on: ubuntu-latest
    continue-on-error: true  # Permite que el workflow continúe aunque este job falle
    outputs:
      status: ${{ steps.status.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment check
        id: status
        run: |
          echo "Running preliminary checks..."
          
          # Simular verificaciones que pueden fallar
          if [ "${{ inputs.force_failure }}" == "true" ]; then
            echo "❌ Forced failure for testing"
            echo "result=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Verificar estructura del proyecto
          if [ ! -f "package.json" ]; then
            echo "⚠️  Warning: No package.json found"
            echo "result=warning" >> $GITHUB_OUTPUT
          else
            echo "✅ Project structure looks good"
            echo "result=success" >> $GITHUB_OUTPUT
          fi

      - name: Additional checks that continue on error
        continue-on-error: true  # Este step específico no falla el job
        run: |
          echo "Running additional checks..."
          # Simular un check que puede fallar pero no es crítico
          npm audit --audit-level=high || echo "Audit failed but continuing..."

  # Job crítico que debe completarse
  critical-codeql:
    name: Critical CodeQL Analysis
    runs-on: ubuntu-latest
    # No depende de preliminary-checks para que se ejecute aunque ese falle
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript
        queries: security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:javascript-typescript"

    - name: Verify analysis completion
      run: echo "✅ Critical CodeQL analysis completed successfully"

  # Job que depende del crítico pero maneja errores del preliminary
  post-analysis:
    name: Post-Analysis Processing
    runs-on: ubuntu-latest
    needs: [preliminary-checks, critical-codeql]
    # Se ejecuta siempre que critical-codeql sea exitoso, 
    # independientemente del resultado de preliminary-checks
    if: always() && needs.critical-codeql.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process results based on preliminary checks
        run: |
          echo "Processing analysis results..."
          echo "Preliminary checks result: ${{ needs.preliminary-checks.result }}"
          echo "Critical CodeQL result: ${{ needs.critical-codeql.result }}"
          
          if [ "${{ needs.preliminary-checks.result }}" == "failure" ]; then
            echo "⚠️  Preliminary checks failed, but CodeQL analysis was successful"
            echo "Proceeding with caution..."
          elif [ "${{ needs.preliminary-checks.result }}" == "success" ]; then
            echo "✅ All checks passed successfully"
          else
            echo "ℹ️  Preliminary checks were skipped or cancelled"
          fi

      - name: Generate summary report
        run: |
          echo "# Security Analysis Summary" > analysis-summary.md
          echo "" >> analysis-summary.md
          echo "- Preliminary Checks: ${{ needs.preliminary-checks.result }}" >> analysis-summary.md
          echo "- CodeQL Analysis: ${{ needs.critical-codeql.result }}" >> analysis-summary.md
          echo "" >> analysis-summary.md
          
          if [ "${{ needs.critical-codeql.result }}" == "success" ]; then
            echo "## ✅ Status: SECURITY ANALYSIS COMPLETED" >> analysis-summary.md
            echo "The critical security analysis was successful." >> analysis-summary.md
          fi
          
          if [ "${{ needs.preliminary-checks.result }}" == "failure" ]; then
            echo "## ⚠️  Note: Preliminary checks failed" >> analysis-summary.md
            echo "This doesn't affect the core security analysis but may indicate environment issues." >> analysis-summary.md
          fi

      - name: Upload summary
        uses: actions/upload-artifact@v3
        with:
          name: analysis-summary
          path: analysis-summary.md

  # Job que solo se ejecuta si TODOS los jobs anteriores fueron exitosos
  success-celebration:
    name: All Systems Green
    runs-on: ubuntu-latest
    needs: [preliminary-checks, critical-codeql, post-analysis]
    if: success()  # Solo se ejecuta si TODOS los jobs previos fueron exitosos
    steps:
      - name: Celebrate success
        run: |
          echo "🎉 ALL SECURITY CHECKS PASSED!"
          echo "✅ Preliminary checks: SUCCESS"
          echo "✅ CodeQL analysis: SUCCESS" 
          echo "✅ Post-analysis: SUCCESS"
          echo ""
          echo "Repository is secure and ready for deployment! 🚀"

  # Job que se ejecuta solo si algún job falló
  failure-investigation:
    name: Investigate Failures
    runs-on: ubuntu-latest
    needs: [preliminary-checks, critical-codeql, post-analysis]
    if: failure()  # Solo se ejecuta si algún job previo falló
    steps:
      - name: Investigate failure
        run: |
          echo "🚨 INVESTIGATING SECURITY ANALYSIS FAILURES"
          echo "============================================="
          echo ""
          echo "Job Results:"
          echo "- Preliminary checks: ${{ needs.preliminary-checks.result }}"
          echo "- Critical CodeQL: ${{ needs.critical-codeql.result }}"
          echo "- Post-analysis: ${{ needs.post-analysis.result }}"
          echo ""
          
          if [ "${{ needs.critical-codeql.result }}" == "failure" ]; then
            echo "🔴 CRITICAL: CodeQL analysis failed!"
            echo "This indicates potential security issues or configuration problems."
            echo "Action required: Review CodeQL logs and fix identified issues."
          fi
          
          if [ "${{ needs.preliminary-checks.result }}" == "failure" ]; then
            echo "🟡 WARNING: Preliminary checks failed"
            echo "This may indicate environment or dependency issues."
          fi
          
          echo ""
          echo "Next steps:"
          echo "1. Review failed job logs for specific error messages"
          echo "2. Fix identified issues"
          echo "3. Re-run the workflow or push new changes"

  # Job que SIEMPRE se ejecuta para limpieza y reporte final
  final-cleanup:
    name: Final Report and Cleanup  
    runs-on: ubuntu-latest
    needs: [preliminary-checks, critical-codeql, post-analysis, success-celebration, failure-investigation]
    if: always()  # SIEMPRE se ejecuta, sin importar el resultado de jobs previos
    steps:
      - name: Final security report
        run: |
          echo "📋 FINAL SECURITY WORKFLOW REPORT"
          echo "=================================="
          echo "Execution completed on: $(date)"
          echo ""
          echo "Job Execution Summary:"
          echo "- Preliminary Checks: ${{ needs.preliminary-checks.result }}"
          echo "- Critical CodeQL: ${{ needs.critical-codeql.result }}"
          echo "- Post Analysis: ${{ needs.post-analysis.result }}"
          echo "- Success Celebration: ${{ needs.success-celebration.result }}"
          echo "- Failure Investigation: ${{ needs.failure-investigation.result }}"
          echo ""
          
          # Determinar estado general
          if [ "${{ needs.critical-codeql.result }}" == "success" ]; then
            echo "🟢 OVERALL SECURITY STATUS: PASSED"
            echo "Core security analysis completed successfully."
            if [ "${{ needs.preliminary-checks.result }}" == "failure" ]; then
              echo "Note: Some preliminary checks failed but core security is intact."
            fi
          else
            echo "🔴 OVERALL SECURITY STATUS: FAILED"
            echo "Critical security analysis needs attention."
          fi
          
          echo ""
          echo "Workflow completed. Check individual job logs for details."

      - name: Cleanup temporary files
        run: |
          echo "🧹 Performing cleanup..."
          # Simular limpieza de archivos temporales
          echo "Cleanup completed successfully"

      - name: Archive workflow logs
        run: |
          echo "📁 Archiving workflow execution information..."
          echo "Workflow: CodeQL Error Handling Demo" > workflow-log.txt
          echo "Execution ID: ${{ github.run_id }}" >> workflow-log.txt
          echo "Trigger: ${{ github.event_name }}" >> workflow-log.txt
          echo "Branch: ${{ github.ref_name }}" >> workflow-log.txt
          echo "Completed: $(date)" >> workflow-log.txt

      - name: Upload workflow log
        uses: actions/upload-artifact@v3
        with:
          name: workflow-execution-log
          path: workflow-log.txt
          retention-days: 30
